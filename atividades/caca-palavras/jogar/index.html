<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras | Hey, Teacher!™</title>
<meta name="description" content="Caça-palavras em inglês online e grátis, do nível A1 ao C2.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/styles.css">
<link rel="stylesheet" href="/atividades/styles/atividades.css?v=20260916-1">
<link rel="stylesheet" href="/atividades/styles/puzzles.css?v=20260916-1">
<link rel="stylesheet" href="/atividades/styles/wordsearch.css?v=20260916-1">
</head>
<body>

<div data-include="nav"></div>

<div class="ac-app" data-activity-root>

  <header class="cards-header">
    <a href="/atividades/caca-palavras/" class="back-btn" id="pz-back" aria-label="Back to levels">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      <span id="pz-back-label">Levels</span>
    </a>

    <div class="level-info">
      <span class="level-badge" id="level-badge">A1</span>
      <span class="level-name" id="level-name">Beginner</span>
    </div>

    <div class="header-actions">
      <span class="progress-counter" id="progress-counter" aria-live="polite" hidden></span>
      <button class="header-btn reset-btn" id="reset-btn" type="button">Reset All</button>
    </div>
  </header>

  <!-- ─── Theme selection ─── -->
  <main class="pz-themes" id="pz-themes" hidden>
    <div class="pz-themes-intro">
      <h1 class="pz-themes-title">Choose a theme</h1>
      <p class="pz-themes-sub" id="pz-themes-sub">&nbsp;</p>
    </div>
    <div class="pz-themes-grid" id="pz-themes-grid">
      <!-- Generated by puzzles.js -->
    </div>
  </main>

  <!-- ─── Puzzle ─── -->
  <main class="pz-main" id="pz-puzzle" hidden>
    <section class="pz-board" aria-label="Word search grid">
      <div class="pz-bar" id="ws-bar">
        <div class="pz-bar-body" aria-live="polite">
          <span class="pz-bar-label" id="ws-bar-label">Find</span>
          <p class="pz-bar-text" id="ws-bar-text">&nbsp;</p>
        </div>
      </div>

      <div class="ws-stage" id="ws-stage">
        <div class="ws-board" id="ws-board">
          <div class="ws-area">
            <svg class="ws-marks" id="ws-marks" aria-hidden="true"></svg>
            <div class="ws-grid" id="ws-grid" aria-label="Letter grid: drag across a word, or tap its first and last letters"></div>
          </div>
        </div>
      </div>

      <div class="pz-toolbar" role="toolbar" aria-label="Puzzle tools">
        <div class="pz-tool-group">
          <span class="pz-tool-label">Help</span>
          <button class="pz-tool" type="button" data-action="hint">Hint</button>
          <button class="pz-tool" type="button" data-action="reveal-word">Reveal word</button>
          <button class="pz-tool" type="button" data-action="reveal-all">Reveal all</button>
        </div>
      </div>

      <div class="pz-toast" id="pz-toast" role="status" aria-live="polite"></div>
    </section>

    <aside class="pz-panel ws-panel" aria-label="Word list">
      <div class="ws-panel-head">
        <h2 class="pz-panel-heading" id="ws-list-heading">Words to find</h2>
        <div class="ws-mode" role="radiogroup" aria-label="The list shows">
          <button type="button" role="radio" data-mode="words" aria-checked="true">Words</button>
          <button type="button" role="radio" data-mode="clues" aria-checked="false">Clues</button>
        </div>
      </div>
      <ol class="ws-list" id="ws-list"></ol>
      <p class="ws-directions" id="ws-directions"></p>
    </aside>
  </main>

  <!-- ─── Completion dialog ─── -->
  <div class="pz-modal" id="pz-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pz-modal-title">
    <div class="pz-modal-card">
      <div class="pz-modal-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h2 class="pz-modal-title" id="pz-modal-title">All words found!</h2>
      <p class="pz-modal-text" id="pz-modal-text">&nbsp;</p>
      <div class="pz-modal-actions">
        <a class="pz-modal-btn" id="pz-modal-themes" href="#">All themes</a>
        <button class="pz-modal-btn" id="pz-modal-close" type="button">Keep looking</button>
        <a class="pz-modal-btn primary" id="pz-modal-next" href="#">
          Next puzzle
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</div>

<section class="ac-cta-band">
  <div class="wrap ac-cta-inner">
    <p><strong>Quer usar esse vocabulário numa conversa de verdade?</strong>Agende uma aula diagnóstica gratuita com o professor Alexandre.</p>
    <a href="/contato/#agendar" class="btn btn-primary">Agendar aula gratuita →</a>
  </div>
</section>

<div data-include="footer"></div>

<script src="/atividades/scripts/common.js?v=20260916-1"></script>
<script src="/atividades/scripts/puzzles.js?v=20260916-1"></script>
<script src="/atividades/scripts/wordsearch.js?v=20260916-1"></script>
<script src="/scripts/includes.js" defer></script>
<script src="/scripts/main.js" defer></script>
</body>
</html>
