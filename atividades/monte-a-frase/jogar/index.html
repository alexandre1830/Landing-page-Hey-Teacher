<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JXD2KCQXS0"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte a Frase | Hey, Teacher!™</title>
<meta name="description" content="Jogo para montar frases em inglês online e grátis, do nível A1 ao C2.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/styles.css">
<link rel="stylesheet" href="/atividades/styles/atividades.css?v=20260917-2">
<link rel="stylesheet" href="/atividades/styles/puzzles.css?v=20260917-2">
<link rel="stylesheet" href="/atividades/styles/sentences.css?v=20260917-2">
</head>
<body>

<div data-include="nav"></div>

<div class="ac-app" data-activity-root>

  <header class="cards-header">
    <a href="/atividades/monte-a-frase/" class="back-btn" id="pz-back" aria-label="Back to levels">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      <span id="pz-back-label">Levels</span>
    </a>

    <div class="level-info">
      <span class="level-badge" id="level-badge">A1</span>
      <span class="level-name" id="level-name">Beginner</span>
    </div>

    <div class="header-actions">
      <span class="progress-counter" id="progress-counter" aria-live="polite" hidden></span>
      <button class="header-btn reset-btn" id="reset-btn" type="button">Reset All</button>
    </div>
  </header>

  <!-- ─── Theme selection ─── -->
  <main class="pz-themes" id="pz-themes" hidden>
    <div class="pz-themes-intro">
      <h1 class="pz-themes-title">Choose a theme</h1>
      <p class="pz-themes-sub" id="pz-themes-sub">&nbsp;</p>
    </div>
    <div class="pz-themes-grid" id="pz-themes-grid">
      <!-- Generated by puzzles.js -->
    </div>
  </main>

  <!-- ─── Game ─── -->
  <main class="pz-main" id="pz-puzzle" hidden>
    <section class="pz-board" aria-label="Sentence builder">
      <div class="pz-bar" id="sb-bar">
        <button class="pz-bar-nav" id="sb-prev" type="button" aria-label="Previous sentence">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="pz-bar-body" aria-live="polite">
          <span class="pz-bar-label" id="sb-bar-label">Sentence 1</span>
          <p class="pz-bar-text" id="sb-bar-text">&nbsp;</p>
        </div>
        <button class="pz-bar-nav" id="sb-next-sentence" type="button" aria-label="Next sentence">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="sb-stage" id="sb-stage">
        <div class="sb-stage-inner" id="sb-stage-inner">
          <div class="sb-answer" id="sb-answer" aria-label="Your sentence" aria-live="polite" lang="en"></div>
          <div class="sb-bank" id="sb-bank" role="group" aria-label="Words" lang="en"></div>
          <div class="sb-controls">
            <p class="sb-status" id="sb-status" aria-live="polite"></p>
            <div class="sb-actions">
              <span class="sb-tries" id="sb-tries"></span>
              <button class="sb-btn ghost" id="sb-clear" type="button">Clear</button>
              <button class="sb-btn primary" id="sb-check" type="button">Check</button>
            </div>
          </div>
        </div>
      </div>

      <div class="pz-toolbar" role="toolbar" aria-label="Game tools">
        <div class="pz-tool-group">
          <span class="pz-tool-label">Help</span>
          <button class="pz-tool" type="button" data-action="next-word">Next word</button>
          <button class="pz-tool" type="button" data-action="show-answer">Show answer</button>
        </div>
      </div>

      <div class="pz-toast" id="pz-toast" role="status" aria-live="polite"></div>
    </section>

    <aside class="pz-panel" aria-label="Round progress">
      <div class="sb-score" id="sb-score"></div>
      <h2 class="pz-panel-heading">This round</h2>
      <ol class="sb-round" id="sb-round"></ol>
    </aside>
  </main>

  <!-- ─── Completion dialog ─── -->
  <div class="pz-modal" id="pz-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pz-modal-title">
    <div class="pz-modal-card">
      <div class="pz-modal-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h2 class="pz-modal-title" id="pz-modal-title">Round complete!</h2>
      <p class="pz-modal-text" id="pz-modal-text">&nbsp;</p>
      <div class="pz-modal-actions">
        <a class="pz-modal-btn" id="pz-modal-themes" href="#">All themes</a>
        <button class="pz-modal-btn" id="pz-modal-close" type="button">Review sentences</button>
        <a class="pz-modal-btn primary" id="pz-modal-next" href="#">
          Next round
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</div>

<section class="ac-cta-band">
  <div class="wrap ac-cta-inner">
    <p><strong>Quer destravar o inglês de verdade?</strong>Agende uma aula diagnóstica gratuita com o professor Alexandre.</p>
    <a href="/contato/#agendar" class="btn btn-primary">Agendar aula gratuita →</a>
  </div>
</section>

<div data-include="footer"></div>

<script src="/atividades/scripts/common.js?v=20260917-2"></script>
<script src="/atividades/scripts/puzzles.js?v=20260917-2"></script>
<script src="/atividades/scripts/sentences.js?v=20260917-2"></script>
<script src="/scripts/includes.js" defer></script>
<script src="/scripts/main.js" defer></script>
</body>
</html>
