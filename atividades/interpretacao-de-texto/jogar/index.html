<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interpretação de Texto | Hey, Teacher!™</title>
<meta name="description" content="Textos em inglês com perguntas de interpretação, online e grátis, do nível A1 ao C2.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/styles.css">
<link rel="stylesheet" href="/atividades/styles/atividades.css?v=20260917-5">
<link rel="stylesheet" href="/atividades/styles/puzzles.css?v=20260917-5">
<link rel="stylesheet" href="/atividades/styles/reading.css?v=20260917-5">
</head>
<body>

<div data-include="nav"></div>

<div class="ac-app" data-activity-root>

  <header class="cards-header">
    <a href="/atividades/interpretacao-de-texto/" class="back-btn" id="pz-back" aria-label="Back to levels">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      <span id="pz-back-label">Levels</span>
    </a>

    <div class="level-info">
      <span class="level-badge" id="level-badge">A1</span>
      <span class="level-name" id="level-name">Beginner</span>
    </div>

    <div class="header-actions">
      <span class="progress-counter" id="progress-counter" aria-live="polite" hidden></span>
      <button class="header-btn reset-btn" id="reset-btn" type="button">Reset All</button>
    </div>
  </header>

  <!-- ─── Text selection ─── -->
  <main class="pz-themes" id="pz-themes" hidden>
    <div class="pz-themes-intro">
      <h1 class="pz-themes-title">Choose a text</h1>
      <p class="pz-themes-sub" id="pz-themes-sub">&nbsp;</p>
    </div>
    <div class="pz-themes-grid" id="pz-themes-grid">
      <!-- Generated by puzzles.js -->
    </div>
  </main>

  <!-- ─── Reading ─── -->
  <main class="pz-main rd-main" id="pz-puzzle" hidden>
    <div class="rd-tabs" role="tablist" aria-label="Reading">
      <button type="button" class="rd-tab is-active" data-tab="text" role="tab" aria-selected="true">Text</button>
      <button type="button" class="rd-tab" data-tab="questions" role="tab" aria-selected="false">Questions <span class="rd-tab-count" id="rd-tab-count"></span></button>
    </div>

    <article class="rd-text" id="rd-text" lang="en" aria-labelledby="rd-title">
      <div class="rd-text-inner">
        <div class="rd-text-head">
          <span class="rd-genre" id="rd-genre"></span>
          <span class="rd-meta" id="rd-meta"></span>
        </div>
        <h2 class="rd-title" id="rd-title">&nbsp;</h2>
        <div class="rd-body" id="rd-body"></div>
        <button type="button" class="rd-btn primary rd-to-questions" data-tab-go="questions">Answer the questions →</button>
      </div>
    </article>

    <section class="rd-quiz" id="rd-quiz" aria-label="Questions">
      <div class="rd-quiz-top">
        <div class="rd-score" id="rd-score"></div>
        <ol class="rd-dots" id="rd-dots" aria-label="Questions"></ol>
      </div>

      <div class="rd-question" id="rd-question" lang="en"></div>

      <div class="rd-actions">
        <button class="rd-nav" id="rd-prev" type="button" aria-label="Previous question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button class="pz-tool" id="rd-hint" type="button">Show the sentence</button>
        <button class="rd-btn ghost" id="rd-next" type="button">Skip →</button>
      </div>
    </section>
  </main>

  <!-- ─── Completion dialog ─── -->
  <div class="pz-modal" id="pz-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pz-modal-title">
    <div class="pz-modal-card">
      <div class="pz-modal-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h2 class="pz-modal-title" id="pz-modal-title">Text complete!</h2>
      <p class="pz-modal-text" id="pz-modal-text">&nbsp;</p>
      <div class="pz-modal-actions">
        <a class="pz-modal-btn" id="pz-modal-themes" href="#">All texts</a>
        <button class="pz-modal-btn" id="pz-modal-close" type="button">Review answers</button>
        <a class="pz-modal-btn primary" id="pz-modal-next" href="#">
          Next text
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</div>

<section class="ac-cta-band">
  <div class="wrap ac-cta-inner">
    <p><strong>Quer destravar o inglês de verdade?</strong>Agende uma aula diagnóstica gratuita com o professor Alexandre.</p>
    <a href="/contato/#agendar" class="btn btn-primary">Agendar aula gratuita →</a>
  </div>
</section>

<div data-include="footer"></div>

<script src="/atividades/scripts/common.js?v=20260917-5"></script>
<script src="/atividades/scripts/puzzles.js?v=20260917-5"></script>
<script src="/atividades/scripts/reading.js?v=20260917-5"></script>
<script src="/scripts/includes.js" defer></script>
<script src="/scripts/main.js" defer></script>
</body>
</html>
