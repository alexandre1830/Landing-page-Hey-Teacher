<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Gramática | Hey, Teacher!™</title>
<meta name="description" content="Quiz de gramática em inglês online e grátis, do nível A1 ao C2.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/styles.css">
<link rel="stylesheet" href="/atividades/styles/atividades.css?v=20260917-4">
<link rel="stylesheet" href="/atividades/styles/puzzles.css?v=20260917-4">
<link rel="stylesheet" href="/atividades/styles/quiz.css?v=20260917-4">
</head>
<body>

<div data-include="nav"></div>

<div class="ac-app" data-activity-root>

  <header class="cards-header">
    <a href="/atividades/quiz-de-gramatica/" class="back-btn" id="pz-back" aria-label="Back to levels">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      <span id="pz-back-label">Levels</span>
    </a>

    <div class="level-info">
      <span class="level-badge" id="level-badge">A1</span>
      <span class="level-name" id="level-name">Beginner</span>
    </div>

    <div class="header-actions">
      <button class="header-btn qz-sound-btn" id="qz-sound" type="button" aria-pressed="true" hidden></button>
      <span class="progress-counter" id="progress-counter" aria-live="polite" hidden></span>
      <button class="header-btn reset-btn" id="reset-btn" type="button">Reset All</button>
    </div>
  </header>

  <!-- ─── Topic selection ─── -->
  <main class="pz-themes" id="pz-themes" hidden>
    <div class="pz-themes-intro">
      <h1 class="pz-themes-title">Choose a grammar topic</h1>
      <p class="pz-themes-sub" id="pz-themes-sub">&nbsp;</p>
    </div>
    <div class="pz-themes-grid" id="pz-themes-grid">
      <!-- Generated by puzzles.js -->
    </div>
  </main>

  <!-- ─── Show ─── -->
  <main class="pz-main" id="pz-puzzle" hidden>
    <section class="pz-board qz-board" aria-label="Quiz show">
      <div class="pz-bar" id="qz-bar">
        <button class="pz-bar-nav" id="qz-prev" type="button" aria-label="Previous question" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="pz-bar-body" aria-live="polite">
          <span class="pz-bar-label" id="qz-bar-label">Get ready</span>
          <p class="pz-bar-text" id="qz-bar-text">&nbsp;</p>
        </div>
        <span class="qz-points" id="qz-points" hidden></span>
        <div class="qz-timer" id="qz-timer" role="timer" aria-label="Time left" hidden>
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle class="qz-timer-track" cx="20" cy="20" r="17"/>
            <circle class="qz-timer-ring" id="qz-timer-ring" cx="20" cy="20" r="17" pathLength="100"/>
          </svg>
          <span class="qz-timer-num" id="qz-timer-num"></span>
        </div>
        <button class="pz-bar-nav" id="qz-next" type="button" aria-label="Next question" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="qz-stage" id="qz-stage">
        <!-- Generated by quiz.js -->
      </div>

      <div class="qz-countdown" id="qz-countdown" aria-live="assertive" hidden></div>

      <div class="pz-toolbar" id="qz-toolbar" role="toolbar" aria-label="Show tools" hidden>
        <div class="pz-tool-group" id="qz-lifelines-group">
          <span class="pz-tool-label">Lifelines</span>
          <span class="qz-lifelines" id="qz-lifelines"></span>
        </div>
        <div class="pz-tool-group">
          <span class="pz-tool-label">Host</span>
          <button class="pz-tool" type="button" id="qz-pause"></button>
          <button class="pz-tool" type="button" id="qz-reveal">Reveal answer</button>
        </div>
      </div>

      <div class="pz-toast" id="pz-toast" role="status" aria-live="polite"></div>
    </section>

    <aside class="pz-panel qz-panel" aria-label="Scores and questions">
      <div class="qz-scoreboard" id="qz-scoreboard"></div>
      <h2 class="pz-panel-heading">Questions</h2>
      <ol class="qz-list" id="qz-list"></ol>
    </aside>
  </main>

  <!-- ─── Results dialog ─── -->
  <div class="pz-modal" id="pz-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pz-modal-title">
    <div class="pz-modal-card qz-modal-card">
      <div class="pz-modal-icon qz-modal-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>
        </svg>
      </div>
      <h2 class="pz-modal-title" id="pz-modal-title">Show's over!</h2>
      <div class="qz-results" id="qz-results"></div>
      <p class="pz-modal-text" id="pz-modal-text">&nbsp;</p>
      <div class="pz-modal-actions">
        <a class="pz-modal-btn" id="pz-modal-themes" href="#">All topics</a>
        <button class="pz-modal-btn" id="pz-modal-close" type="button">See results</button>
        <a class="pz-modal-btn primary" id="pz-modal-next" href="#">
          Next topic
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div class="qz-fx" id="qz-fx" aria-hidden="true"></div>

</div>

<section class="ac-cta-band">
  <div class="wrap ac-cta-inner">
    <p><strong>Quer usar a gramática falando, sem travar?</strong>Agende uma aula diagnóstica gratuita com o professor Alexandre.</p>
    <a href="/contato/#agendar" class="btn btn-primary">Agendar aula gratuita →</a>
  </div>
</section>

<div data-include="footer"></div>

<script src="/atividades/scripts/common.js?v=20260917-4"></script>
<script src="/atividades/scripts/puzzles.js?v=20260917-4"></script>
<script src="/atividades/scripts/quiz.js?v=20260917-4"></script>
<script src="/scripts/includes.js" defer></script>
<script src="/scripts/main.js" defer></script>
</body>
</html>
